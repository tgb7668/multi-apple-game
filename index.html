<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🍎 흐융사과게임 - 실시간 대결 결과 모드 🍎</title>
<style>
    /* 기존 스타일 유지 */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    #bg-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-image: url('background.png'); background-size: cover; z-index: -2; }
    body { font-family: 'Malgun Gothic', sans-serif; text-align: center; background-color: #fff; }
    
    #lobby-screen { display: none; position: relative; z-index: 20; background: rgba(255,255,255,0.95); width: 400px; margin: 50px auto; padding: 30px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
    #player-list { list-style: none; margin: 20px 0; padding: 10px; background: #f9f9f9; border-radius: 10px; min-height: 50px; }
    .player-item { padding: 8px; border-bottom: 1px solid #eee; font-weight: bold; }

    #start-screen { display: block; position: relative; z-index: 20; }
    #game-controls { display: flex; flex-direction: column; align-items: center; gap: 15px; margin: 50px auto; background: rgba(255,255,255,0.9); padding: 30px; border-radius: 15px; width: fit-content; }
    
    .menu-btn { padding: 12px; width: 220px; color: #fff; border: none; border-radius: 8px; font-weight: bold; font-size: 16px; cursor: pointer; transition: 0.2s; margin: 5px; }
    #createBtn { background: #2196F3; }
    #joinBtn { background: #FF9800; }
    #startBtn { background: #4CAF50; display: none; }

    #board { display: grid; grid-template-columns: repeat(15, 52px); grid-template-rows: repeat(10, 52px); border: 4px solid #333; width: max-content; margin: 0 auto; background: #fff; position: relative; z-index: 15; user-select: none; }
    .cell { width: 52px; height: 52px; display: flex; align-items: center; justify-content: center; position: relative; }
    .cell img { position: absolute; width: 90%; height: 90%; opacity: 0.7; pointer-events: none; }
    .cell span { 
    position: relative; 
    z-index: 1; 
    color: #000; 
    font-size: 28px; /* 크기를 조금 더 키움 */
    font-weight: 900; /* 더 두껍게 */
    
    /* 숫자 뒤에 흰색 반투명 원형 배경 추가 */
    background: rgba(255, 255, 255, 0.6); 
    width: 35px;
    height: 35px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    
    /* 글자 테두리를 더 명확하게 */
    text-shadow: 1px 1px 0 #fff, -1px -1px 0 #fff, 1px -1px 0 #fff, -1px 1px 0 #fff;
}
    .selected { background-color: rgba(76, 175, 80, 0.5); outline: 3px solid #4caf50; }

    /* 결과창 스타일 수정 */
    #end { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); color: #fff; flex-direction: column; align-items: center; justify-content: center; z-index: 100; padding: 20px; }
    #result-table { width: 100%; max-width: 400px; margin-top: 20px; border-collapse: collapse; background: rgba(255,255,255,0.1); border-radius: 10px; overflow: hidden; }
    #result-table th, #result-table td { padding: 12px; border-bottom: 1px solid rgba(255,255,255,0.2); }
    #result-table th { background: rgba(255,255,255,0.2); }
    .my-row { background: rgba(76, 175, 80, 0.3); color: #4caf50; font-weight: bold; }
</style>
</head>
<body>

<div id="bg-container"></div>

<div id="start-screen">
    <h2>🍎 흐융사과게임 대결 🍎</h2>
    <div id="game-controls">
        <input id="username" type="text" placeholder="닉네임 입력" style="padding:10px; width:220px;">
        <button id="createBtn" class="menu-btn" onclick="createRoom()">새 방 만들기</button>
        <button id="joinBtn" class="menu-btn" onclick="joinRoom()">방 참가하기</button>
    </div>
</div>

<div id="lobby-screen">
    <h2>대기실</h2>
    <p>방 번호: <span id="room-id-display" style="font-weight:bold; color:#2196F3;">-</span></p>
    <div id="player-list"></div>
    <button id="startBtn" class="menu-btn" onclick="triggerStart()">게임 시작하기!</button>
</div>

<div id="game" style="display:none">
    <div style="margin: 20px; font-size: 20px; font-weight: bold;">
        ⏰ <span id="timer">120</span> | 🏆 점수: <span id="score">0</span>
    </div>
    <div id="board"></div>
</div>

<div id="end">
    <h1 style="color: #FFC107; margin-bottom: 10px;">GAME OVER</h1>
    <h3 id="endMsg">성적 집계 중...</h3>
    
    <table id="result-table">
        <thead>
            <tr>
                <th>순위</th>
                <th>닉네임</th>
                <th>점수</th>
            </tr>
        </thead>
        <tbody id="result-body">
            <!-- 결과 데이터가 여기에 들어감 -->
        </tbody>
    </table>

    <button onclick="location.reload()" style="margin-top:30px; padding:12px 30px; cursor:pointer; border-radius:5px; border:none; background:#fff; font-weight:bold;">메뉴로 돌아가기</button>
</div>

<audio id="bgm" src="bgm.mp3" loop></audio>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getFirestore, doc, setDoc, getDoc, updateDoc, onSnapshot, arrayUnion, collection, addDoc, query, orderBy, limit, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDoqne7kGk9WEZc0Yph2RMc7_WAEfPwLFQ",
    authDomain: "heuyung-apple-game.firebaseapp.com",
    projectId: "heuyung-apple-game",
    storageBucket: "heuyung-apple-game.firebasestorage.app",
    messagingSenderId: "922266554072",
    appId: "1:922266554072:web:81bb14dc1fbe590e3211ad"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  window.db = db;
  window.dbFuncs = { doc, setDoc, getDoc, updateDoc, onSnapshot, arrayUnion, collection, addDoc, query, orderBy, limit, getDocs };
</script>

<script>
let currentRoomId = null;
let isHost = false;
let currentSeed = null;
let myName = "";
let unsub = null;
let resultsUnsub = null;

function seedRandom(seed) {
    return function() {
        let t = seed += 0x6D2B79F5;
        t = Math.imul(t ^ t >>> 15, t | 1);
        t ^= t + Math.imul(t ^ t >>> 7, t | 61);
        return ((t ^ t >>> 14) >>> 0) / 4294967296;
    }
}

async function createRoom() {
    myName = document.getElementById("username").value;
    if (!myName) { alert("닉네임을 입력하세요!"); return; }
    const roomId = Math.floor(1000 + Math.random() * 9000).toString();
    const seed = Math.random() * 1000000;
    isHost = true;
    const { doc, setDoc } = window.dbFuncs;
    await setDoc(doc(window.db, "rooms", roomId), {
        seed: seed, players: [myName], status: "waiting", host: myName, results: []
    });
    enterLobby(roomId);
}

async function joinRoom() {
    myName = document.getElementById("username").value;
    const roomId = prompt("방 번호 4자리를 입력하세요:");
    if (!myName || !roomId) return;
    const { doc, getDoc, updateDoc, arrayUnion } = window.dbFuncs;
    const roomRef = doc(window.db, "rooms", roomId);
    const snap = await getDoc(roomRef);
    if (snap.exists() && snap.data().status === "waiting") {
        await updateDoc(roomRef, { players: arrayUnion(myName) });
        enterLobby(roomId);
    } else { alert("입장할 수 없습니다."); }
}

function enterLobby(roomId) {
    currentRoomId = roomId;
    document.getElementById("start-screen").style.display = "none";
    document.getElementById("lobby-screen").style.display = "block";
    document.getElementById("room-id-display").textContent = roomId;
    if (isHost) document.getElementById("startBtn").style.display = "block";

    const { doc, onSnapshot } = window.dbFuncs;
    unsub = onSnapshot(doc(window.db, "rooms", roomId), (doc) => {
        const data = doc.data();
        if (!data) return;
        const listEl = document.getElementById("player-list");
        listEl.innerHTML = data.players.map(p => `<div class="player-item">${p}${p === data.host ? ' (방장)' : ''}</div>`).join("");
        if (data.status === "playing") {
            currentSeed = data.seed;
            unsub();
            realStartGame();
        }
    });
}

async function triggerStart() {
    const { doc, updateDoc } = window.dbFuncs;
    await updateDoc(doc(window.db, "rooms", currentRoomId), { status: "playing" });
}

function realStartGame() {
    document.getElementById("lobby-screen").style.display = "none";
    document.getElementById("game").style.display = "block";
    document.getElementById("bgm").play().catch(()=>{});
    initBoard();
    startTimer();
}

let board = [], cells = [], selected = [];
let score = 0, time = 120, timerInterval, gameOver = false;
let isDragging = false, startCell = null, endCell = null;

function initBoard() {
    const b = document.getElementById("board");
    b.innerHTML = ""; board = []; cells = [];
    const rnd = seedRandom(currentSeed);
    for (let r = 0; r < 10; r++) {
        board[r] = [];
        for (let c = 0; c < 15; c++) {
            const val = Math.floor(rnd() * 9) + 1;
            board[r][c] = val;
            const cell = document.createElement("div");
            cell.className = "cell";
            cell.dataset.r = r; cell.dataset.c = c;
            const img = document.createElement("img"); img.src = "tile.png";
            cell.appendChild(img);
            const span = document.createElement("span"); span.textContent = val;
            cell.appendChild(span);
            b.appendChild(cell);
            cells.push(cell);
        }
    }
}

// 드래그 로직 (생략 방지용 핵심 코드)
function handleStart(e) {
    if (gameOver || document.getElementById("game").style.display === "none") return;
    const clientX = e.clientX || (e.touches && e.touches[0].clientX);
    const clientY = e.clientY || (e.touches && e.touches[0].clientY);
    const cell = document.elementFromPoint(clientX, clientY)?.closest('.cell');
    if (!cell) return;
    isDragging = true; startCell = [+cell.dataset.r, +cell.dataset.c];
    endCell = startCell; updateSelected();
}
function handleMove(e) {
    if (!isDragging || gameOver) return;
    const clientX = e.clientX || (e.touches && e.touches[0].clientX);
    const clientY = e.clientY || (e.touches && e.touches[0].clientY);
    const cell = document.elementFromPoint(clientX, clientY)?.closest('.cell');
    if (!cell) return;
    endCell = [+cell.dataset.r, +cell.dataset.c]; updateSelected();
}
function handleEnd() {
    if (!isDragging) return;
    isDragging = false;
    const sum = selected.reduce((a, [r, c]) => a + board[r][c], 0);
    if (sum === 10) {
        selected.forEach(([r, c]) => {
            board[r][c] = 0;
            cells[r * 15 + c].querySelector("span").textContent = "";
            cells[r * 15 + c].querySelector("img").style.opacity = "0.05";
        });
        score += selected.length;
        document.getElementById("score").textContent = score;
    }
    cells.forEach(c => c.classList.remove("selected"));
    selected = [];
}
function updateSelected() {
    const [r1, c1] = startCell, [r2, c2] = endCell;
    const minR = Math.min(r1, r2), maxR = Math.max(r1, r2);
    const minC = Math.min(c1, c2), maxC = Math.max(c1, c2);
    cells.forEach(c => c.classList.remove("selected"));
    selected = [];
    for (let r = minR; r <= maxR; r++) {
        for (let c = minC; c <= maxC; c++) {
            if (board[r][c] !== 0) {
                selected.push([r, c]);
                cells[r * 15 + c].classList.add("selected");
            }
        }
    }
}

document.addEventListener("mousedown", handleStart);
document.addEventListener("mousemove", handleMove);
window.addEventListener("mouseup", handleEnd);
document.addEventListener("touchstart", (e) => { if(e.target.closest('.cell')) e.preventDefault(); handleStart(e); }, {passive:false});
document.addEventListener("touchmove", (e) => { if(isDragging) e.preventDefault(); handleMove(e); }, {passive:false});
window.addEventListener("touchend", handleEnd);

function startTimer() {
    timerInterval = setInterval(() => {
        time--;
        document.getElementById("timer").textContent = time;
        if (time <= 0) endGame();
    }, 1000);
}

// 🏁 게임 종료 및 전원 결과 표시 로직
async function endGame() {
    gameOver = true;
    clearInterval(timerInterval);
    document.getElementById("game").style.display = "none";
    document.getElementById("end").style.display = "flex";
    
    const { doc, updateDoc, arrayUnion, onSnapshot } = window.dbFuncs;
    const roomRef = doc(window.db, "rooms", currentRoomId);

    // 1. 내 점수 방 데이터에 전송
    await updateDoc(roomRef, {
        results: arrayUnion({ name: myName, score: score })
    });

    // 2. 방 결과 실시간 감시 (모든 사람이 점수 낼 때까지)
    resultsUnsub = onSnapshot(roomRef, (doc) => {
        const data = doc.data();
        if (!data || !data.results) return;

        // 점수 높은 순으로 정렬
        const sorted = [...data.results].sort((a, b) => b.score - a.score);
        
        // 테이블 업데이트
        const tbody = document.getElementById("result-body");
        tbody.innerHTML = sorted.map((res, idx) => `
            <tr class="${res.name === myName ? 'my-row' : ''}">
                <td>${idx + 1}위</td>
                <td>${res.name}</td>
                <td>${res.score}점</td>
            </tr>
        `).join("");

        document.getElementById("endMsg").textContent = "최종 결과 확인";
    });
}
</script>
</body>
</html>
